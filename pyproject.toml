[project]
name = "csv-column-mapper"
version = "1.0.0"
description = "Compare CSV schemas and review one-to-one column mappings."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "python-multipart>=0.0.9,<1.0"]

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "mypy>=1.11,<2.0", "pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
