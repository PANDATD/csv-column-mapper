version = 1
requires-python = ">=3.12"
resolution-markers = ["python_full_version >= '3.12'"]

[[package]]
name = "csv-column-mapper"
version = "1.0.0"
source = { editable = "." }
dependencies = [
  { name = "fastapi" },
  { name = "python-multipart" },
  { name = "uvicorn", extra = ["standard"] },
]

[package.dev-dependencies]
dev = [
  { name = "httpx" },
  { name = "mypy" },
  { name = "pytest" },
  { name = "ruff" },
]

[package.metadata]
requires-dist = [
  { name = "fastapi", specifier = ">=0.115,<1.0" },
  { name = "python-multipart", specifier = ">=0.0.9,<1.0" },
  { name = "uvicorn", extras = ["standard"], specifier = ">=0.30,<1.0" },
]

[package.metadata.dev-dependencies]
dev = [
  { name = "httpx", specifier = ">=0.27,<1.0" },
  { name = "mypy", specifier = ">=1.11,<2.0" },
  { name = "pytest", specifier = ">=8.3,<9.0" },
  { name = "ruff", specifier = ">=0.6,<1.0" },
]
